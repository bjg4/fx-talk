<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">FX Talk — Hold. Speak. Enter.</title>
<desc id="desc">Experimental Mac utility for the FX-MIC. Built with GPT-6 Astra in Codex. An independent project.</desc>
