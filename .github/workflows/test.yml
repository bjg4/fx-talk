name: Test and build
# Hosted checks are paused after the Actions allowance incident.
# Run manually only after an execution budget has been approved.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test.yml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app and run all tests
        run: zsh build.sh
      - name: Ensure generation preserves checked-in payload
        run: git diff --exit-code -- device/
